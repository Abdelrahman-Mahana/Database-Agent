[project]
name = "ai-database-analyst"
version = "0.1.0"
description = "Core Foundation for AI Database Analyst Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.26.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.2.28",
    "sqlparse>=0.4.4",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.1",
    "openai",
    "sqlglot",
    "cachetools",
    "loguru",
    "python-multipart",
    "structlog>=24.2.0",
    "cryptography>=42.0.0",
    "python-json-logger>=2.0.7",
    "sqlalchemy>=2.0.31",
    "pyodbc>=5.1.0",
    "oracledb>=2.2.1",
    "snowflake-sqlalchemy>=1.6.1",
    "sqlalchemy-bigquery>=1.11.0",
    "sqlalchemy-redshift>=0.8.14",
    "clickhouse-sqlalchemy>=0.3.2",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["backend", ".venv", "build", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
